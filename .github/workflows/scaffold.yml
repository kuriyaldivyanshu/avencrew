name: Scaffold checks

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main, setup/initial-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64 scaffold
    # Standard hosted runners are free for public repositories. Do not enable
    # automatic billed fallback if this repository becomes private.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check runner architecture
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
      - name: Install verified managed tools
        run: bash tools/bootstrap/bootstrap.sh
      - name: Build verified native SQLite
        run: bash tools/bootstrap/build-sqlite.sh
      - name: Install locked workspace dependencies
        run: bash tools/bootstrap/dev-env.sh pnpm install --frozen-lockfile
      - name: Rust checks and native engine diagnostic
        run: bash tools/verification/check.sh rust
      - name: Desktop typecheck and build
        run: bash tools/verification/check.sh desktop
      - name: Contract conformance and generated artifact freshness
        run: bash tools/verification/check.sh contracts
      - name: Fixture development without model credentials
        run: bash tools/verification/check.sh fixtures
      - name: Report scope and unavailable lanes
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            printf '## Scaffold verification\n\n'
            printf 'macOS ARM64 job status: **%s**.\n\n' "$JOB_STATUS"
            printf 'A failed, cancelled or skipped job does not establish acceptance.\n\n'
            printf '| Lane | Scope/status |\n|---|---|\n'
            printf '| Rust/desktop/contracts/fixtures | See actual step outcomes above |\n'
            printf '| SQLite diagnostic | Native engine only; no journal or migrations |\n'
            printf '| Linux ARM64 | UNVERIFIED: managed profile and native build not admitted |\n'
            printf '| Electron launch | UNVERIFIED: this workflow builds bundles only |\n'
            printf '| Process/VM containment and recovery | UNVERIFIED: P2/P4 runtime work |\n'
            printf '| PostgreSQL/cloud/model execution | DEFERRED-DISABLED: no account or credential used |\n'
          } >> "$GITHUB_STEP_SUMMARY"
