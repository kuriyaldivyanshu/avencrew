[package]
name = "avencrew-supervisor"
description = "Per-user Avencrew coordinator process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "avencrew-supervisor"
path = "src/main.rs"

[dependencies]
# Direction: supervisor -> all three. This is the only crate that sees every
# component, which is what makes it the place that can report whole-build state.
avencrew-contracts.workspace = true
avencrew-harness.workspace = true
avencrew-store-sqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v7"] }
# Consumed authentication primitives already present at these versions in Cargo.lock.
hmac = { version = "=0.13.0", default-features = false }
sha2-auth = { package = "sha2", version = "=0.11.0", default-features = false }
getrandom = { version = "=0.3.4", default-features = false }
tokio = { workspace = true, features = ["net", "io-util"] }

# Safe OS identity and inherited launch-channel checks; no application FFI.
nix = { version = "=0.31.3", default-features = false, features = ["user", "process", "socket"] }
