[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/harness",
    "crates/store-sqlite",
    "crates/supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
license = "UNLICENSED"
publish = false

# Deny unsafe code workspace-wide. The harness executes model-directed and
# shell-directed activity, so an unsafe escape hatch is not a scaffold nicety.
[workspace.lints.rust]
unsafe_code = "forbid"

# Dependency direction is enforced by Cargo, not by convention:
#
#   contracts  <- no internal dependencies at all
#   harness       -> contracts
#   store-sqlite  -> contracts
#   supervisor    -> contracts, harness, store-sqlite
#
# `contracts` cannot reach provider, Electron, harness or storage types because it
# has no internal dependencies. `harness` cannot reach the SQLite adapter because
# `store-sqlite` is not in its dependency list. Cycles are impossible.
[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
uuid = { version = "=1.27.0", default-features = false, features = ["std", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
schemars = { version = "=1.2.2", default-features = false, features = ["std", "derive"] }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }
jsonschema = { version = "=0.58.5", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
# Consumed local-journal boundary (P1-02). Exact pins, no default features.
# `sqlite-unbundled` describes SQLx's linkage path: it enables
# libsqlite3-sys/buildtime_bindgen and makes the wrapper link the engine we build
# from the verified amalgamation. It does NOT mean "use the host SQLite".
# The `sqlite` umbrella is prohibited: at this version it turns on bundling,
# deserialization, extension loading and unlock-notify.
avencrew-contracts = { path = "crates/contracts" }
avencrew-harness = { path = "crates/harness" }
avencrew-store-sqlite = { path = "crates/store-sqlite" }

sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-unbundled",
] }

# Direct dependency constrains the native wrapper version so the 3.51.3 embedded
# in its `bundled` feature can never be selected. Application code never calls
# this crate's unsafe API; it exists to pin the wrapper SQLx resolves.
libsqlite3-sys = { version = "=0.37.0", default-features = false }

# Example-only runtime. Current-thread builder; no #[tokio::main] requirement.
tokio = { version = "=1.53.2", default-features = false, features = [
    "rt",
    "time",
    "sync",
] }
